name: ai-sre-platform

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2.0}
  OTEL_BATCH_SCHEDULE_DELAY_MILLISECONDS: ${OTEL_BATCH_SCHEDULE_DELAY_MILLISECONDS:-500}
  OUTBOUND_HTTP_TIMEOUT_SECONDS: ${OUTBOUND_HTTP_TIMEOUT_SECONDS:-5.0}
  OUTBOUND_HTTP_MAX_ATTEMPTS: ${OUTBOUND_HTTP_MAX_ATTEMPTS:-2}
  OUTBOUND_HTTP_RETRY_BACKOFF_SECONDS: ${OUTBOUND_HTTP_RETRY_BACKOFF_SECONDS:-0.05}

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-aisre}
  POSTGRES_USER: ${POSTGRES_USER:-aisre}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3.0}

x-queue-environment: &queue-environment
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND_URL: ${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/1}
  QUEUE_PUBLISH_TIMEOUT_SECONDS: ${QUEUE_PUBLISH_TIMEOUT_SECONDS:-2.0}
  INVESTIGATION_MAX_ATTEMPTS: ${INVESTIGATION_MAX_ATTEMPTS:-3}
  INVESTIGATION_RETRY_BASE_SECONDS: ${INVESTIGATION_RETRY_BASE_SECONDS:-2}
  INVESTIGATION_RETRY_MAX_SECONDS: ${INVESTIGATION_RETRY_MAX_SECONDS:-30}
  INVESTIGATION_JOB_LEASE_SECONDS: ${INVESTIGATION_JOB_LEASE_SECONDS:-15}
  CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-300}

x-demo-service: &demo-service
  image: ai-sre-platform:stage04
  build:
    context: .
    dockerfile: infrastructure/docker/demo.Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisre}
      POSTGRES_USER: ${POSTGRES_USER:-aisre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  migrate:
    <<: *demo-service
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: [*app-environment, *database-environment]
    depends_on:
      postgres:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    read_only: true
    volumes:
      - ./observability/otel_collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol-contrib/config.yaml",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  inventory-service:
    <<: *demo-service
    command:
      - uvicorn
      - apps.demo.inventory_service.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *app-environment
      INVENTORY_SKU: ${INVENTORY_SKU:-widget-001}
      INVENTORY_STOCK: ${INVENTORY_STOCK:-100}
      INVENTORY_UNIT_PRICE_CENTS: ${INVENTORY_UNIT_PRICE_CENTS:-1999}
    ports:
      - "127.0.0.1:${INVENTORY_SERVICE_PORT:-8003}:8000"
    healthcheck: &application-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  payment-service:
    <<: *demo-service
    command:
      - uvicorn
      - apps.demo.payment_service.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: [*app-environment, *database-environment]
      FAULT_INJECTION_ALLOWED: "true"
      FAULT_CONTROL_TOKEN: ${FAULT_CONTROL_TOKEN:-local-demo-fault-control}
      SLOW_DATABASE_DELAY_SECONDS: ${SLOW_DATABASE_DELAY_SECONDS:-2.5}
    ports:
      - "127.0.0.1:${PAYMENT_SERVICE_PORT:-8004}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *application-healthcheck

  alert-receiver:
    <<: *demo-service
    profiles: ["test-tools"]
    command:
      - uvicorn
      - apps.demo.alert_receiver.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *app-environment
    ports:
      - "127.0.0.1:${ALERT_RECEIVER_PORT:-8005}:8000"
    healthcheck: *application-healthcheck

  incident-api:
    <<: *demo-service
    command:
      - uvicorn
      - apps.incident_api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: [*app-environment, *database-environment, *queue-environment]
    ports:
      - "127.0.0.1:${INCIDENT_API_PORT:-8006}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *application-healthcheck

  investigator-worker:
    <<: *demo-service
    hostname: investigator-worker
    command:
      - celery
      - -A
      - apps.investigator_worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --hostname=investigator@%h
    environment:
      <<: [*app-environment, *database-environment, *queue-environment]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "apps.investigator_worker.celery_app:celery_app",
          "inspect",
          "ping",
          "--destination",
          "investigator@investigator-worker",
          "--timeout",
          "2",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      incident-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "/bin/amtool",
          "check-config",
          "/etc/alertmanager/alertmanager.yml",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  order-service:
    <<: *demo-service
    command:
      - uvicorn
      - apps.demo.order_service.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *app-environment
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8002}:8000"
    depends_on:
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck: *application-healthcheck

  gateway:
    <<: *demo-service
    command:
      - uvicorn
      - apps.demo.gateway.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *app-environment
      ORDER_SERVICE_URL: http://order-service:8000
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8001}:8000"
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck: *application-healthcheck

  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      gateway:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      incident-api:
        condition: service_started
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:
  redis-data:
