# Preserve the browser-supplied X-Request-ID for end-to-end correlation;
# generate one only when the browser did not send a value.
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy so the browser never needs cross-origin credentials.
    # Prefix match without trailing slash would also proxy /apiary-style paths
    # to the SPA fallback's detriment, so the bare /api path gets an exact
    # match and only /api/... uses the prefix (a bare /api used to fall
    # through to try_files and return HTML instead of JSON).
    location = /api {
        proxy_pass http://incident-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $forwarded_request_id;
    }
    location /api/ {
        proxy_pass http://incident-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $forwarded_request_id;
    }

    location /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}\n';
    }

    # SPA fallback: React Router handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
