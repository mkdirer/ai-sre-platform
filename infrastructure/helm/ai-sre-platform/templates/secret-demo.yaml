{{- /* Local-demo credentials ONLY. Placeholders mirror .env.example.
  Never point this at production: use external-secrets or CSI driver
  (see infrastructure/terraform secret-manager module) instead. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-sre.fullname" . }}-demo-secrets
  labels:
    {{- include "ai-sre.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Placeholder parity with POSTGRES_PASSWORD=change-me in .env.example.
  postgres-password: "change-me"
  # Placeholder parity with FAULT_CONTROL_TOKEN=local-demo-fault-control.
  fault-control-token: "local-demo-fault-control"
  # Empty by default, mirroring OPENAI_API_KEY= in .env.example.
  openai-api-key: ""
