{{- /* Minimal service accounts. No pod needs the Kubernetes API. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-sre.fullname" . }}-app
  labels:
    {{- include "ai-sre.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-sre.fullname" . }}-worker
  labels:
    {{- include "ai-sre.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
