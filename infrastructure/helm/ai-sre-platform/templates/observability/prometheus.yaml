{{- if .Values.observability.prometheus.enabled }}
# Scrape + alerting config mirrors observability/prometheus/*.yml, with
# in-cluster DNS targets instead of compose service names (identical here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sre.fullname" . }}-prometheus-config
  labels:
    {{- include "ai-sre.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/demo-alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    scrape_configs:
      - job_name: gateway
        static_configs: [{ targets: ["gateway:8000"] }]
      - job_name: order-service
        static_configs: [{ targets: ["order-service:8000"] }]
      - job_name: inventory-service
        static_configs: [{ targets: ["inventory-service:8000"] }]
      - job_name: payment-service
        static_configs: [{ targets: ["payment-service:8000"] }]
      - job_name: incident-api
        static_configs: [{ targets: ["incident-api:8000"] }]
      - job_name: investigator-worker
        static_configs: [{ targets: ["investigator-worker:9464"] }]
  demo-alerts.yml: |
    groups:
      - name: demo-checkout
        interval: 5s
        rules:
          - alert: DemoPaymentHighLatency
            expr: >-
              histogram_quantile(0.95, sum by (le) (
                rate(demo_http_request_duration_seconds_bucket{
                  service="payment-service", method="POST",
                  route="/payments"}[20s]))) > 2
            for: 5s
            labels: { severity: warning, service: payment-service, fault: slow_database }
            annotations: { summary: Payment service latency exceeds the local demo threshold }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "ai-sre.componentLabels" (dict "component" "prometheus" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    {{- include "ai-sre.componentSelector" (dict "component" "prometheus" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "ai-sre.componentLabels" (dict "component" "prometheus" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  replicas: 1 # Singleton TSDB for the demo.
  selector:
    matchLabels:
      {{- include "ai-sre.componentSelector" (dict "component" "prometheus" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-sre.componentSelector" (dict "component" "prometheus" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-sre.fullname" . }}-app
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.observability.prometheus.retentionTime }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules/demo-alerts.yml
              subPath: demo-alerts.yml
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            # Data writes require a writable fs here (accepted local-demo risk;
# see docs/runbooks/scan-triage.md).
            readOnlyRootFilesystem: false # TSDB writes.
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-sre.fullname" . }}-prometheus-config
        - name: rules
          configMap:
            name: {{ include "ai-sre.fullname" . }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-sre.fullname" . }}-prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-sre.fullname" . }}-prometheus-data
  labels:
    {{- include "ai-sre.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.observability.prometheus.storageClassName }}
  storageClassName: {{ .Values.observability.prometheus.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.observability.prometheus.storageSize | quote }}
{{- end }}
