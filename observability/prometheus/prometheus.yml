global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway:8000]
  - job_name: order-service
    static_configs:
      - targets: [order-service:8000]
  - job_name: inventory-service
    static_configs:
      - targets: [inventory-service:8000]
  - job_name: payment-service
    static_configs:
      - targets: [payment-service:8000]
  - job_name: incident-api
    static_configs:
      - targets: [incident-api:8000]
  - job_name: investigator-worker
    static_configs:
      - targets: [investigator-worker:9464]
