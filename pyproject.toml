[project]
name = "ai-sre-platform"
version = "0.1.0"
description = "Evidence-grounded AI SRE incident investigation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "celery[redis]==5.6.3",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "prometheus-client==0.26.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "contract: service API contract tests with in-process dependencies",
    "integration: tests requiring the declared PostgreSQL or Compose services",
]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.12.9"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]
