name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python, Compose, checkout, telemetry, incident, and queue checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Run deterministic quality gate
        run: make check UV_SYNC_FLAGS="--all-groups --locked"

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Inspect service health
        run: docker compose ps

      - name: Run checkout smoke and integration tests
        run: |
          make smoke
          make test-integration
          make smoke-observability
          make scenario-incident-pipeline

      - name: Capture redacted service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > compose-failure.log || true
          uv run python scripts/redact_secrets.py compose-failure.log > compose-failure.redacted.log
          cat compose-failure.redacted.log

      - name: Upload redacted failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-failure-logs
          path: compose-failure.redacted.log
          retention-days: 30

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Frontend lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install, lint, typecheck, test, and build
        working-directory: apps/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build
